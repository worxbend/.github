# Publishes the static site in `docs/` to GitHub Pages.
#
# The repository's Pages setting is already "GitHub Actions" (build_type: workflow), which means
# GitHub does not run Jekyll on the repo — it waits for a workflow like this one to hand it a
# finished folder. That is why there is no Gemfile, no `_config.yml`, and no build step: `docs/`
# is the site exactly as it will be served.
#
# The published URL is https://worxbend.github.io/.github/ — note the `/.github/` sub-path. Every
# asset reference is relative (`./assets/...`), so local HTTP preview matches the deployed site.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'scripts/site.test.mjs'
      - 'tests/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/site.test.mjs'
      - 'tests/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  # Lets a maintainer redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Pull-request validation needs only read access. Deployment permissions are scoped to its job.
permissions:
  contents: read

# Serialize runs per branch; an in-flight deployment finishes before the next one starts.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Validate site assets and core behavior
        run: npm test
      - name: Verify desktop and mobile browser behavior
        run: npm run test:browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  deploy:
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    # `workflow_dispatch` lets whoever starts the run pick any branch, tag or commit, and
    # `actions/checkout` honours that choice — so without this guard a manual run could publish an
    # unreviewed branch's `docs/` to the live site. Only `main` is ever deployed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the docs/ folder as the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
